<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>本地视频库</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar" aria-label="分类侧边栏">

<div class="sidebar-header">
<h2>📁 分类</h2>
<button class="add-cat-btn" id="addCatBtn" title="添加分类">+</button>
</div>

<div class="cat-list" id="catList"></div>

<div class="sidebar-footer">

<button class="backup-btn" id="catManageBtn">
⚙️ 管理分类
</button>

<button class="backup-btn" id="exportBtn">
📥 导出备份
</button>

<button class="backup-btn" id="importBtn">
📤 恢复备份
</button>

<div class="storage-bar">
<div class="storage-fill" id="storageFill"></div>
</div>

<div class="storage-text" id="storageText">
视频占用 0 MB · 0 个
</div>

</div>

</aside>


<main class="main">

<div class="topbar">

<div class="topbar-left">

<button
class="menu-btn"
id="menuBtn"
aria-label="打开分类菜单"
>
☰
</button>

<h1 id="pageTitle">
全部视频
</h1>

</div>


<div class="topbar-actions">

<div
class="selection-toolbar"
id="selectionToolbar"
>

<span id="selectedCount">
已选择 0 个
</span>

<button
class="toolbar-btn"
id="downloadSelectedBtn"
>
⬇ 批量下载
</button>

<button
class="toolbar-btn cancel-selection-btn"
id="clearSelectionBtn"
>
取消选择
</button>

</div>


<button
class="upload-btn"
id="uploadBtnMain"
>
<span>＋</span>
上传视频
</button>

</div>

</div>


<!-- ==================================================
     工具栏
     ================================================== -->

<div class="view-toolbar" id="viewToolbar">

<div class="view-toolbar-left">

<button
class="view-btn active"
id="gridViewBtn"
data-view="grid"
>
▦ 网格
</button>

<button
class="view-btn"
id="timelineViewBtn"
data-view="timeline"
>
◷ 时间轴
</button>

<button
class="view-btn"
id="tagViewBtn"
data-view="tag"
>
🏷️ 标签
</button>

</div>

<div class="view-toolbar-right">

<button
class="select-all-btn"
id="selectAllBtn"
>
全选
</button>

</div>

</div>


<div
class="content"
id="content"
>

<div class="loading-state">
正在加载视频库…
</div>

</div>

</main>

</div>


<div
class="sidebar-overlay"
id="sidebarOverlay">
</div>


<!-- ==================================================
     上传
     ================================================== -->

<div
class="modal-overlay"
id="uploadModal"
>

<div class="modal">

<div class="modal-header">

<h3>
📤 上传视频
</h3>

<button
class="modal-close"
data-close="uploadModal"
>
×
</button>

</div>


<div class="modal-body">

<div class="form-group">

<label for="uploadCat">
选择分类
</label>

<select id="uploadCat"></select>

</div>


<div class="form-group">

<label for="uploadTags">
标签
</label>

<input
type="text"
id="uploadTags"
maxlength="200"
placeholder="例如：英语、学习、素材，用逗号分隔"
>

<p class="form-hint">
分类用于归类视频；标签用于进一步细分和搜索。
</p>

</div>


<div class="form-group">

<label>
选择视频文件
</label>

<div
class="file-drop"
id="fileDrop"
>

<div class="drop-icon">
🎬
</div>

<p>
点击或拖拽视频到此处
</p>

<p class="drop-hint">
可一次选择多个视频，原始文件直接保存，不转码、不压缩
</p>

<div
class="file-name"
id="fileName">
</div>

</div>


<input
type="file"
id="fileInput"
accept="video/mp4,video/*"
multiple
>

</div>


<p class="form-hint">
所有视频均按原始文件保存。
网页不会改变原文件。
</p>

</div>


<div class="modal-footer">

<button
class="btn btn-secondary"
data-close="uploadModal"
>
取消
</button>

<button
class="btn btn-primary"
id="uploadConfirmBtn"
disabled
>
上传
</button>

</div>

</div>

</div>


<!-- ==================================================
     播放器
     ================================================== -->

<div
class="modal-overlay"
id="playerModal"
>

<div class="modal player-modal">

<div class="modal-header">

<h3>
▶️ 播放
</h3>

<button
class="modal-close"
data-close="playerModal"
>
×
</button>

</div>


<div class="player-container">

<video
id="playerVideo"
controls
playsinline
preload="metadata"
>
</video>

</div>


<div class="player-info">

<h3 id="playerTitle">
视频标题
</h3>

<p id="playerMeta">
分类 · 大小 · 日期
</p>


<div
class="player-tags"
id="playerTags"
>
</div>


<div class="player-actions">

<button
class="btn btn-primary"
id="playerDownloadBtn"
>
⬇ 下载原文件
</button>

</div>

</div>

</div>

</div>


<!-- ==================================================
     添加分类
     ================================================== -->

<div
class="modal-overlay"
id="catModal"
>

<div class="modal modal-sm">

<div class="modal-header">

<h3>
➕ 添加新分类
</h3>

<button
class="modal-close"
data-close="catModal"
>
×
</button>

</div>


<div class="modal-body">

<div class="form-group">

<label for="newCatName">
分类名称
</label>

<input
type="text"
id="newCatName"
maxlength="30"
placeholder="例如：学习、素材、收藏…"
>

</div>

</div>


<div class="modal-footer">

<button
class="btn btn-secondary"
data-close="catModal"
>
取消
</button>

<button
class="btn btn-primary"
id="addCatConfirmBtn"
>
添加
</button>

</div>

</div>

</div>


<!-- ==================================================
     恢复备份
     ================================================== -->

<div
class="modal-overlay"
id="importModal"
>

<div class="modal modal-sm">

<div class="modal-header">

<h3>
📤 恢复备份
</h3>

<button
class="modal-close"
data-close="importModal"
>
×
</button>

</div>


<div class="modal-body">

<div
class="import-drop"
id="importDrop"
>

<div class="drop-icon">
📂
</div>

<p>
点击选择 JSON 备份文件
</p>

<p class="drop-hint">
恢复会覆盖当前视频、分类和标签
</p>

<div
class="file-name"
id="importFileName">
</div>

</div>


<input
type="file"
id="importInput"
accept="application/json,.json"
>

</div>


<div class="modal-footer">

<button
class="btn btn-secondary"
data-close="importModal"
>
取消
</button>

<button
class="btn btn-primary"
id="importConfirmBtn"
disabled
>
恢复
</button>

</div>

</div>

</div>


<!-- ==================================================
     管理分类
     ================================================== -->

<div
class="modal-overlay"
id="catManageModal"
>

<div class="modal modal-md">

<div class="modal-header">

<h3>
⚙️ 管理分类
</h3>

<button
class="modal-close"
data-close="catManageModal"
>
×
</button>

</div>


<div
class="modal-body"
id="catManageBody"
>
</div>


<div class="modal-footer">

<button
class="btn btn-secondary"
data-close="catManageModal"
>
关闭
</button>

</div>

</div>

</div>


<!-- ==================================================
     Toast
     ================================================== -->

<div
class="toast"
id="toast"
role="status"
aria-live="polite"
>
</div>


<script src="app.js"></script>

</body>
</html>
