<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地视频库</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📁 分类</h2>
                <button class="add-cat-btn" id="addCatBtn" title="添加分类">+</button>
            </div>
            <div class="cat-list" id="catList"></div>
            <div class="sidebar-footer">
                <button class="backup-btn" id="catManageBtn">⚙️ 管理分类</button>
                <button class="backup-btn" id="exportBtn">📥 导出备份</button>
                <button class="backup-btn" id="importBtn">📤 恢复备份</button>
                <div class="storage-bar"><div class="storage-fill" id="storageFill"></div></div>
                <div class="storage-text" id="storageText">已用 0 / 5 MB</div>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main">
            <div class="topbar">
                <h1 id="pageTitle">全部视频</h1>
                <button class="menu-btn" id="menuBtn">☰</button>
                <button class="upload-btn" id="uploadBtnMain">
                    <span>+</span> 上传视频
                </button>
            </div>
            <div class="content" id="content"></div>
        </main>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 上传模态框 -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <div class="modal-header">
                <h3>📤 上传视频</h3>
                <button class="modal-close" data-close="uploadModal">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>选择分类</label>
                    <select id="uploadCat"></select>
                </div>
                <div class="form-group">
                    <label>选择视频文件</label>
                    <div class="file-drop" id="fileDrop">
                        <div class="drop-icon">🎬</div>
                        <p>点击或拖拽视频文件到此处</p>
                        <p class="drop-hint">支持 MP4, WebM, MOV 等格式</p>
                        <div class="file-name" id="fileName"></div>
                    </div>
                    <input type="file" id="fileInput" accept="video/*">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-close="uploadModal">取消</button>
                <button class="btn btn-primary" id="uploadConfirmBtn" disabled>上传</button>
            </div>
        </div>
    </div>

    <!-- 播放器模态框 -->
    <div class="modal-overlay" id="playerModal">
        <div class="modal player-modal">
            <div class="modal-header">
                <h3>▶️ 播放</h3>
                <button class="modal-close" data-close="playerModal">×</button>
            </div>
            <div class="player-container">
                <video id="playerVideo" controls playsinline></video>
            </div>
            <div class="player-info">
                <h3 id="playerTitle">视频标题</h3>
                <p id="playerMeta">分类 · 大小 · 日期</p>
            </div>
        </div>
    </div>

    <!-- 添加分类模态框 -->
    <div class="modal-overlay" id="catModal">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h3>➕ 添加新分类</h3>
                <button class="modal-close" data-close="catModal">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>分类名称</label>
                    <input type="text" id="newCatName" placeholder="例如：教程、电影、音乐...">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-close="catModal">取消</button>
                <button class="btn btn-primary" id="addCatConfirmBtn">添加</button>
            </div>
        </div>
    </div>

    <!-- 导入模态框 -->
    <div class="modal-overlay" id="importModal">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h3>📤 恢复备份</h3>
                <button class="modal-close" data-close="importModal">×</button>
            </div>
            <div class="modal-body">
                <div class="import-drop" id="importDrop">
                    <div class="drop-icon">📂</div>
                    <p>点击选择备份 JSON 文件</p>
                    <p class="drop-hint">将覆盖现有数据，请谨慎操作</p>
                    <div class="file-name" id="importFileName"></div>
                </div>
                <input type="file" id="importInput" accept=".json">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-close="importModal">取消</button>
                <button class="btn btn-primary" id="importConfirmBtn" disabled>恢复</button>
            </div>
        </div>
    </div>

    <!-- 分类管理模态框 -->
    <div class="modal-overlay" id="catManageModal">
        <div class="modal modal-md">
            <div class="modal-header">
                <h3>⚙️ 管理分类</h3>
                <button class="modal-close" data-close="catManageModal">×</button>
            </div>
            <div class="modal-body" id="catManageBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-close="catManageModal">关闭</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
